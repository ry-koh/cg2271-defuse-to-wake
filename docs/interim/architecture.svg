<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#fff"/>

  <!-- Column containers -->
  <rect x="10" y="10" width="220" height="336" rx="6" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
  <text x="120" y="30" text-anchor="middle" font-size="13" font-weight="bold">MCXC444 (FreeRTOS)</text>
  <rect x="330" y="10" width="190" height="336" rx="6" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
  <text x="425" y="30" text-anchor="middle" font-size="13" font-weight="bold">ESP32</text>
  <rect x="590" y="10" width="160" height="336" rx="6" fill="#f2f2f2" stroke="#666" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="670" y="30" text-anchor="middle" font-size="13" font-weight="bold">Online</text>

  <!-- MCX: sensors -->
  <g fill="#fff" stroke="#000" stroke-width="1">
    <rect x="22" y="44" width="196" height="32"/>
    <rect x="22" y="86" width="196" height="32"/>
    <rect x="22" y="128" width="196" height="32"/>
    <rect x="22" y="182" width="196" height="44" stroke-width="2"/>
    <rect x="22" y="262" width="196" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="64">Rotary encoder (IRQ)</text>
    <text x="120" y="106">PS2 joystick (polled ADC)</text>
    <text x="120" y="148">HC-SR04 (timer capture)</text>
    <text x="120" y="201" font-weight="bold">Game engine</text>
    <text x="120" y="217">tasks + queues + ISRs</text>
    <text x="120" y="281">Passive buzzer (PWM)</text>
    <text x="120" y="297">On-board RGB LED (PWM)</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="120" y1="76" x2="120" y2="80" stroke="none"/>
    <path d="M50,76 V182" fill="none"/>
    <path d="M120,118 V182" fill="none"/>
    <path d="M190,160 V182" fill="none"/>
    <path d="M120,226 V262" fill="none"/>
  </g>

  <!-- ESP32 -->
  <g fill="#fff" stroke="#000" stroke-width="1">
    <rect x="342" y="44" width="166" height="44"/>
    <rect x="342" y="182" width="166" height="44" stroke-width="2"/>
  </g>
  <rect x="342" y="246" width="166" height="88" fill="none" stroke="#666" stroke-dasharray="4 3"/>
  <g fill="#fff" stroke="#000" stroke-width="1">
    <rect x="352" y="262" width="146" height="32"/>
    <rect x="352" y="298" width="146" height="32"/>
  </g>
  <g text-anchor="middle">
    <text x="425" y="63" font-weight="bold">Network task</text>
    <text x="425" y="79">WiFiMulti, HTTPS, NTP</text>
    <text x="425" y="201" font-weight="bold">UART link task</text>
    <text x="425" y="217">frames, ACK, retransmit</text>
    <text x="425" y="260" font-size="11" fill="#444">I2C bus</text>
    <text x="425" y="282">MPU-6050 gyro (I2C)</text>
    <text x="425" y="318">SSD1306 OLED (I2C)</text>
  </g>
  <g stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#ah)" marker-start="url(#ah)">
    <path d="M425,88 V182"/>
    <path d="M425,226 V246"/>
  </g>

  <!-- UART between the boards -->
  <path d="M218,204 H342" stroke="#000" stroke-width="2" fill="none" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="280" y="168" text-anchor="middle" font-size="11">UART 115200,</text>
  <text x="280" y="181" text-anchor="middle" font-size="11">CRC-8 + ACK</text>
  <path d="M280,185 V204" stroke="#000" stroke-width="0.75" fill="none"/>

  <!-- Online services -->
  <g fill="#fff" stroke="#000" stroke-width="1">
    <rect x="602" y="44" width="136" height="36"/>
    <rect x="602" y="92" width="136" height="36"/>
    <rect x="602" y="140" width="136" height="36"/>
    <rect x="602" y="188" width="136" height="36"/>
  </g>
  <g text-anchor="middle">
    <text x="670" y="66">NUSMods API</text>
    <text x="670" y="114">SoCLaaS LLM</text>
    <text x="670" y="157">Firebase</text>
    <text x="670" y="170">Realtime DB</text>
    <text x="670" y="210">NTP</text>
  </g>
  <path d="M508,66 H602" stroke="#000" stroke-width="2" fill="none" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="555" y="58" text-anchor="middle" font-size="11">HTTPS</text>
  <text x="555" y="86" text-anchor="middle" font-size="11">(NTP: UDP)</text>
</svg>
